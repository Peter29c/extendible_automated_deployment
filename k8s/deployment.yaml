apiVersion: apps/v1
kind: Deployment

metadata:
  name: ead-development-api
  namespace: ead-development-api

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ead-development-api

  template:
    metadata:
      labels:
        app: ead-development-api
        app.kubernetes.io/name: ead-development-api
        app.kubernetes.io/component: ead-development-api
        app.kubernetes.io/part-of: ead

    spec:
      serviceAccount: ead-development-api

      containers:
        - name: ead-development-api

          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/ECR_REPOSITORY:IMAGE_TAG

          envFrom:
            - secretRef:
                name: ead-development-api-secret
            
            - configMapRef:
                name: ead-development-api-config

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"