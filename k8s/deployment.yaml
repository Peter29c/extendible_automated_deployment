apiVersion: apps/v1
kind: Deployment

metadata:
  name: ead-api

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1    

  selector:
    matchLabels:
      app: ead-api

  template:
    metadata:
      labels:
        app: ead-api

    spec:
      containers:
        - name: ead/ead-api

          image: account.dkr.ecr.us-east-2.amazonaws.com/ead/ead-api:IMAGE_TAG

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"