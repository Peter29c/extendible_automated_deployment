name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Chekout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-versionb: 24

      - name: Install Dependencies
        run: npn ci

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build