name: Deploy

on:
  # workflow_dispatch:
  workflow_run:
    workflows:
      - Docker
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  resolve-environment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Resolve Environment
        id: env
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          if [ "$BRANCH" = "development" ]; then
            echo "environment=development" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "staging" ]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported deployment branch: $BRANCH"
            exit 1
          fi

  deploy:
    needs: resolve-environment
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-environment.outputs.environment }}

    concurrency:
      group: deploy-${{ needs.resolve-environment.outputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS Credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME  }}

      - name: Verify Cluster Access
        run:  kubectl get nodes

      - name: Ensure Namespace Exists
        run: |
          kubectl get namespaces ${{ secrets.K8S_NAMESPACE }}

      # - name: Apply Kubernetes Manifests
      #   run: |
      #     kubectl apply -f k8s/service-account.yaml
      #     kubectl apply -f k8s/configmap.yaml
      #     kubectl apply -f k8s/secret.yaml
      #     kubectl apply -f k8s/deployment.yaml
      #     kubectl apply -f k8s/service.yaml
      #     kubectl apply -f k8s/hpa.yaml
      #     kubectl apply -f k8s/pdb.yaml

      # ead-development-api
      - name: Deploy New Image
        run: |
          IMAGE_REPOSITORY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}"

          kubectl set image deployment/ead-${{ needs.resolve-environment.outputs.environment }}-api \
            ead-${{ needs.resolve-environment.outputs.environment }}-api="$IMAGE_REPOSITORY:${{ github.event.workflow_run.head_sha }}" \
            --namespace "${{ secrets.K8S_NAMESPACE }}"

      - name: Verify Running Image
        run: |
          kubectl get deployment ead-${{ needs.resolve-environment.outputs.environment }}-api \
            -o jsonpath="{.spec.template.spec.containers[0].image}" \
            --namespace "${{ secrets.K8S_NAMESPACE }}"
            
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/ead-${{ needs.resolve-environment.outputs.environment }}-api \
            --namespace "${{ secrets.K8S_NAMESPACE }}"
            --timeout=300s

      - name: Rollback On Failure
        if: failure()
        run: |
          kubectl rollout undo deployment/ead-${{ needs.resolve-environment.outputs.environment }}-api \
            --namespace "${{ secrets.K8S_NAMESPACE }}"

      - name: Show Deployment
        run: |
          kubectl get deployment ead-${{ needs.resolve-environment.outputs.environment }}-api \
            --namespace "${{ secrets.K8S_NAMESPACE }}"
      
      - name: Show Pods
        run: |
          kubectl get pods \
            --namespace "${{ secrets.K8S_NAMESPACE }}"